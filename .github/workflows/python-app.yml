
name: LAB9 - Pipeline CI/CD

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab9-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: lab9-fastapi
  AWS_REGION: us-east-1
  EC2_INSTANCE_ID: i-03957d570b8193030

jobs:
  build:
    name: Verificar API
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx

      - name: Testar API
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from main import app

          client = TestClient(app)
          response = client.get("/health")

          assert response.status_code == 200
          assert response.json()["status"] == "ok"

          print("API funcionando corretamente!")
          PY

  docker_build:
    name: Construir imagem Docker
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: |
          docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Verificar imagem criada
        run: |
          docker image inspect "${IMAGE_NAME}:${GITHUB_SHA}"

  deploy_homologacao:
    name: Deploy Homologacao
    runs-on: ubuntu-latest
    needs: docker_build

    if: github.ref == 'refs/heads/develop'

    environment:
      name: homologacao

    steps:
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Enviar deploy para EC2
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          cat > ssm-parameters.json <<'JSON'
          {
            "commands": [
              "set -e",
              "cd /home/ubuntu/lab9-cicd-unisenai",
              "sudo -H -u ubuntu git -C /home/ubuntu/lab9-cicd-unisenai fetch origin develop",
              "sudo -H -u ubuntu git -C /home/ubuntu/lab9-cicd-unisenai checkout develop",
              "sudo -H -u ubuntu git -C /home/ubuntu/lab9-cicd-unisenai reset --hard DEPLOY_COMMIT",
              "docker build -t lab9-fastapi:DEPLOY_COMMIT .",
              "docker rm -f lab9-fastapi || true",
              "docker run -d --name lab9-fastapi --restart unless-stopped -p 8080:8080 lab9-fastapi:DEPLOY_COMMIT",
              "for i in $(seq 1 15); do if curl -fsS http://127.0.0.1:8080/health; then echo 'API funcionando!'; exit 0; fi; sleep 2; done; echo 'Falha no health check'; exit 1"
            ]
          }
          JSON

          sed -i "s/DEPLOY_COMMIT/${DEPLOY_SHA}/g" ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "Comando enviado: $COMMAND_ID"

          if aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"; then
            echo "Comando SSM executado com sucesso."
          else
            echo "O comando SSM apresentou falha."
          fi

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" \
            --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "Erro: deploy de homologacao falhou."
            exit 1
          fi

      - name: Confirmar homologacao
        run: |
          echo "Deploy de homologacao concluido!"
          echo "Commit: $GITHUB_SHA"
